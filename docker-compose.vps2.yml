# docker-compose.vps2.yml - VPS 2 production override (2.24.130.53)
# Docker postgres starts (satisfies depends_on health check) but is unused.
# All services connect to the EXISTING local postgres at 172.18.0.1 which has the real data.
# Deploy: docker compose -f docker-compose.yml -f docker-compose.vps2.yml up -d --build <service>
services:
  app:
    environment:
      DATABASE_URL: "postgresql://repricer:h111j333!@172.18.0.1:5432/repricer_db"
      NODE_ENV: "production"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  repricer:
    environment:
      DATABASE_URL: "postgresql://repricer:h111j333!@172.18.0.1:5432/repricer_db"
      NODE_ENV: "production"
      # FAST_WORKERS = sum of (ip_count × 0.8) for all Python-enabled accounts.
      # Current: Antique Haven (100 IPs → 80) + Smartpick (10 IPs → 8) = 88 → 90 with headroom.
      # If Lahrians Store (100 IPs) is also enabled, raise to 170.
      FAST_WORKERS: "90"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  orders:
    environment:
      DATABASE_URL: "postgresql://repricer:h111j333!@172.18.0.1:5432/repricer_db"
      NODE_ENV: "production"
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  python-scraper:
    environment:
      # SCRAPER_WORKERS = Python ThreadPoolExecutor size.
      # Must be ≥ FAST_WORKERS so the thread pool never queues Node.js requests.
      SCRAPER_WORKERS: "100"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
