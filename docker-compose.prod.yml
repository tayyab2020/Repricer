# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.prod.yml  — PRODUCTION OVERRIDES
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Adds a self-hosted PostgreSQL container.
# Removes host-exposed ports (only the API port is public).
# Adds resource limits and production logging.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Production PostgreSQL ───────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB:       "${POSTGRES_DB:-repricer}"
      POSTGRES_USER:     "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis — no host port exposure in production ─────────────────────────────
  redis:
    ports: !reset []    # override: don't expose 6379 externally

  # ── App — point to containerised postgres, set NODE_ENV=production ──────────
  app:
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-repricer}"
      NODE_ENV: "production"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1.5G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  repricer:
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-repricer}"
      NODE_ENV: "production"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1.5G   # Node.js ~300MB + Chromium for Keepa ~300MB; 512M caused OOM kills
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  orders:
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-repricer}"
      NODE_ENV: "production"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  python-scraper:
    deploy:
      resources:
        limits:
          memory: 1G    # Playwright Chromium needs more memory
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  redis_data:
  postgres_data:
